<!DOCTYPE html><html lang="tr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADOS · Giriş · Arma Digital</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['-apple-system','BlinkMacSystemFont','Segoe UI','Roboto','sans-serif'],mono:['ui-monospace','SFMono-Regular','Menlo','Consolas','monospace']}}}}</script>
<style>
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
button:focus-visible,input:focus-visible{outline:2px solid #f59e0b;outline-offset:1px;border-radius:6px;}
</style>
</head>
<body class="bg-gray-50 dark:bg-[#0d0e13] text-gray-900 dark:text-gray-100">

<button onclick="tDk()" class="fixed top-4 right-4 z-50 flex items-center justify-center rounded-md bg-white dark:bg-[#1e1f26] hover:bg-gray-50 dark:hover:bg-[#2a2b33] text-gray-500 dark:text-gray-400 border border-gray-200 dark:border-gray-700 transition-colors" style="width:34px;height:34px;">
  <svg id="iSun" class="hidden" style="width:14px;height:14px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg id="iMoon" style="width:14px;height:14px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-[380px]">

    <div class="flex flex-col items-center mb-6">
      <div class="flex items-center gap-1.5 mb-4">
        <div class="rounded flex items-center justify-center bg-[#2D3748]" style="width:34px;height:34px;"><span class="text-white font-bold" style="font-size:15px;">A</span></div>
        <div class="rounded flex items-center justify-center bg-[#4A5568]" style="width:34px;height:34px;"><span class="text-white font-bold" style="font-size:15px;">D</span></div>
        <div class="rounded flex items-center justify-center bg-[#2D3748]" style="width:34px;height:34px;"><span class="text-white font-bold" style="font-size:15px;">O</span></div>
        <div class="rounded flex items-center justify-center bg-[#4A5568]" style="width:34px;height:34px;"><span class="text-white font-bold" style="font-size:15px;">S</span></div>
      </div>
      <h1 class="text-[20px] font-bold text-gray-900 dark:text-gray-100 tracking-tight">Komuta Merkezi</h1>
      <p class="text-[11px] text-gray-500 dark:text-gray-400 mt-1">Ajans Değil · İşletim Sistemi</p>
    </div>

    <div class="bg-white dark:bg-[#17181f] border border-gray-200 dark:border-gray-700/60 rounded-lg p-6">

      <div class="mb-5">
        <h2 class="text-[15px] font-semibold text-gray-900 dark:text-gray-100">Hoş Geldiniz</h2>
        <p class="text-[12px] text-gray-500 dark:text-gray-400 mt-0.5">Hesabınıza giriş yapın</p>
      </div>

      <form onsubmit="event.preventDefault();login();" class="space-y-4">

        <div>
          <label class="block text-[11px] font-medium text-gray-700 dark:text-gray-300 mb-1.5">Kullanıcı Adı</label>
          <input id="username" type="text" placeholder="kullanici.adi" autocomplete="username"
            class="w-full px-3 py-2.5 text-[13px] bg-white dark:bg-[#1e1f26] border border-gray-300 dark:border-gray-700 rounded-md text-gray-900 dark:text-gray-100 placeholder:text-gray-400 dark:placeholder:text-gray-600 focus:outline-none focus:border-gray-900 dark:focus:border-gray-400 transition-colors"/>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-[11px] font-medium text-gray-700 dark:text-gray-300">Şifre</label>
            <button type="button" onclick="showMsg()" class="text-[11px] text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200 transition-colors">Şifremi unuttum</button>
          </div>
          <div class="relative">
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"
              class="w-full px-3 py-2.5 pr-10 text-[13px] bg-white dark:bg-[#1e1f26] border border-gray-300 dark:border-gray-700 rounded-md text-gray-900 dark:text-gray-100 placeholder:text-gray-400 dark:placeholder:text-gray-600 focus:outline-none focus:border-gray-900 dark:focus:border-gray-400 transition-colors"/>
            <button type="button" onclick="togglePwd()" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 transition-colors p-0.5">
              <svg id="eyeOpen" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeClosed" class="hidden" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <label class="flex items-center gap-2 cursor-pointer group pt-1">
          <input type="checkbox" id="remember" class="sr-only peer"/>
          <span class="w-4 h-4 border border-gray-300 dark:border-gray-600 rounded peer-checked:bg-gray-900 dark:peer-checked:bg-gray-100 peer-checked:border-gray-900 dark:peer-checked:border-gray-100 flex items-center justify-center transition-colors">
            <svg class="w-3 h-3 text-white dark:text-gray-900 hidden peer-checked:block" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          <span class="text-[11px] text-gray-600 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-gray-200 transition-colors">Beni hatırla</span>
        </label>

        <button type="submit" class="w-full flex items-center justify-center gap-2 py-2.5 bg-gray-900 hover:bg-gray-800 dark:bg-gray-100 dark:hover:bg-white text-white dark:text-gray-900 font-semibold text-[13px] rounded-md transition-colors">
          Giriş Yap
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>

      </form>

      <div class="mt-5 pt-4 border-t border-gray-100 dark:border-gray-700/60">
        <p class="text-[11px] text-gray-500 dark:text-gray-400 leading-relaxed">
          Üyelik sistemi bulunmamaktadır. Erişim için sistem yöneticiniz ile iletişime geçiniz.
        </p>
      </div>
    </div>

    <div class="mt-5 flex flex-col items-center gap-1 text-[10px] text-gray-400 dark:text-gray-600">
      <div class="flex items-center gap-2">
        <span>arma.digital</span>
        <span class="w-1 h-1 rounded-full bg-gray-300 dark:bg-gray-700"></span>
        <span class="font-mono">ADOS v4.1.0</span>
        <span class="w-1 h-1 rounded-full bg-gray-300 dark:bg-gray-700"></span>
        <span>© 2026</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span>
        <span>Sistem operasyonel</span>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="fixed bottom-6 right-6 z-50 hidden"></div>

<script>
function tDk(){
  document.documentElement.classList.toggle('dark');
  const d=document.documentElement.classList.contains('dark');
  document.getElementById('iSun').classList.toggle('hidden',!d);
  document.getElementById('iMoon').classList.toggle('hidden',d);
}
function togglePwd(){
  const i=document.getElementById('password');
  const o=document.getElementById('eyeOpen');
  const c=document.getElementById('eyeClosed');
  if(i.type==='password'){i.type='text';o.classList.add('hidden');c.classList.remove('hidden');}
  else{i.type='password';o.classList.remove('hidden');c.classList.add('hidden');}
}
function showMsg(){
  const el=document.getElementById('toast');
  const dark=document.documentElement.classList.contains('dark');
  el.innerHTML='<div style="background:'+(dark?'#1e1f26':'white')+';border:1px solid '+(dark?'#374151':'#e5e7eb')+';border-radius:8px;padding:12px 16px;max-width:320px;font-size:12px;color:'+(dark?'#d1d5db':'#374151')+';">Şifre sıfırlama için sistem yöneticinize başvurunuz.</div>';
  el.classList.remove('hidden');
  setTimeout(()=>el.classList.add('hidden'),3200);
}
function login(){
  const btn=document.querySelector('button[type="submit"]');
  btn.innerHTML='<svg class="animate-spin w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>Giriş yapılıyor...';
  btn.disabled=true;
  setTimeout(()=>{window.location.href='ADOS_Genel_Mudur_Panosu_v2.html';},500);
}
document.addEventListener('DOMContentLoaded',()=>{
  if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
    document.documentElement.classList.add('dark');
    document.getElementById('iSun').classList.remove('hidden');
    document.getElementById('iMoon').classList.add('hidden');
  }
  document.getElementById('username').focus();
});
</script>
</body></html>
